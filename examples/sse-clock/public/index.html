<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSE clock</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f5f2; color: #1d1d1b;
         font-family: system-ui, sans-serif; }
  main { text-align: center; padding: 0 16px; }
  #time { margin: 0; font-size: clamp(3rem, 14vw, 7rem); font-variant-numeric: tabular-nums; }
  #state { margin: 8px 0 0; color: #6b6a64; }
</style>
</head>
<body>
<main>
  <p id="time">--:--:--</p>
  <p id="state">connecting</p>
</main>
<script>
  const time = document.getElementById("time");
  const state = document.getElementById("state");
  // The server publishes "time" events once per second and sends "close" when it shuts down.
  const source = new EventSource("/events");
  source.addEventListener("time", (event) => {
    time.textContent = event.data;
    state.textContent = "live, UTC";
  });
  source.addEventListener("close", () => {
    state.textContent = "server stopped";
    source.close();
  });
  source.onerror = () => {
    state.textContent = "reconnecting";
  };
</script>
</body>
</html>
